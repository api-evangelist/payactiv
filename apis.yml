aid: payactiv
name: PayActiv
description: >-
  Payactiv is a Milpitas, California financial-worktech company that provides Earned Wage Access (EWA),
  a digital wallet, Visa prepaid and payroll cards, savings and financial-wellness services to hourly
  workers through their employers. Its developer-facing product, Access-as-a-Service, packages that
  platform as modular APIs so HCM, HRIS, payroll and benefits platforms can embed earned wage access,
  card issuance and transactions, instant payouts and workforce-data workflows under their own brand.
  The API surface is documented as OpenAPI-based inside a developer portal at developer.payactiv.com,
  which also carries the platform change log and sandbox environments; the portal requires an account,
  so no public specification, reference or sandbox values are reachable anonymously. Payactiv is
  registered with NMLS (ID 2591928) and holds state EWA licenses, and publishes a Trust Center citing
  SOC 2, ISO 27001, PCI DSS and CCPA.
