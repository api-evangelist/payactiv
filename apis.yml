apis:
- aid: payactiv:payactiv-access-as-a-service-api
  name: Payactiv Access-as-a-Service API
  description: >-
    Access-as-a-Service is Payactiv's API-driven infrastructure for embedding Earned Wage Access, debit
    and payroll card programs, instant payouts, and HCM workforce-data workflows into a partner platform
    under the partner's own brand. Payactiv documents the surface as authentication, orchestration,
    webhooks and sandbox environments, with an OpenAPI-based reference, change log and sandbox samples
    published inside the developer portal. The specification is not served anonymously.
  humanURL: https://payactiv.com/developers/
  baseURL: https://api.payactiv.com
