  x-evidence:
    fetched: '2026-08-04'
    baseURL_probe:
      url: https://api.payactiv.com/
      http_status: 500
      note: >-
        Host resolves to an AWS ELB named api-v2 fronting Microsoft-IIS/10.0 (ASP.NET 4.0); the root
        path returns an ASP.NET runtime-error page, so the host is live but exposes no anonymous route.
    reference_probe:
      url: https://apidevelopergatewayservice.payactiv.com/users/modules/1
      http_status: 401
      note: >-
        The developer portal (Angular SPA, meta robots noindex,nofollow) loads its OpenAPI documents
        from this gateway endpoint and renders them with swagger-ui-dist / redoc. Anonymous requests
        return 401, so the specification cannot be harvested without portal credentials.
